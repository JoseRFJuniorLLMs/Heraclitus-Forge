[project]
name = "heraclitus-forge-tools"
version = "2.0.0"
requires-python = ">=3.10"

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["meu_env", "registry", "samples", "md", "rust"]

[tool.ruff.lint]
select = ["B", "BLE", "E4", "E7", "E9", "F", "I", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"dashboard.py" = ["BLE001", "S110"]
"web_forge.py" = ["BLE001"]
"inserir.py" = ["S311"]
"tests/**" = ["BLE001", "S101", "S310", "S603"]
