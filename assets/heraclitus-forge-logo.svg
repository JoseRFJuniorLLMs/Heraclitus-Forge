<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 420" role="img" aria-labelledby="title desc">
  <title id="title">Heraclitus Forge</title>
  <desc id="desc">Heraclitus Forge logo: connected blue nodes transforming into an orange forge data stream.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1298ff"/>
      <stop offset="1" stop-color="#0879e8"/>
    </linearGradient>
    <radialGradient id="ember" cx="42%" cy="45%" r="70%">
      <stop offset="0" stop-color="#ffbf23"/>
      <stop offset=".5" stop-color="#ff7b00"/>
      <stop offset="1" stop-color="#f04a00"/>
    </radialGradient>
    <linearGradient id="forgeText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a10"/>
      <stop offset="1" stop-color="#f05200"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1800" height="420" rx="36" fill="#ffffff"/>

  <!-- Heraclitus-family graph mark -->
  <g transform="translate(48 44)">
    <path d="M85 125 L290 52 L245 255 L98 300" fill="none" stroke="url(#blue)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="85" cy="125" r="55" fill="url(#blue)"/>
    <circle cx="290" cy="52" r="55" fill="url(#blue)"/>
    <circle cx="98" cy="300" r="55" fill="url(#blue)"/>

    <!-- forged transformation core -->
    <path d="M182 190 C205 168 227 172 250 191 C272 209 290 211 316 205" fill="none" stroke="#ffffff" stroke-width="17" stroke-linecap="round"/>
    <circle cx="190" cy="214" r="49" fill="url(#ember)" filter="url(#softGlow)" opacity=".98"/>
    <path d="M188 214 C235 214 250 214 295 214" fill="none" stroke="#ff7b00" stroke-width="34" stroke-linecap="round"/>
    <circle cx="322" cy="214" r="15" fill="#ff7b00"/>
    <circle cx="361" cy="214" r="10" fill="#ff8d00"/>
    <circle cx="392" cy="214" r="7" fill="#ff9a10"/>
    <circle cx="337" cy="250" r="10" fill="#ff6c00"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700">
    <text x="500" y="275" font-size="190" fill="#050505" letter-spacing="-8">Heraclitus</text>
    <circle cx="1138" cy="83" r="22" fill="#1298ff"/>
    <text x="1270" y="275" font-size="190" fill="url(#forgeText)" letter-spacing="-7">Forge</text>
  </g>
</svg>