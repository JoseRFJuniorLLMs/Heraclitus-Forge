version: '6.0'
dag:
  parse:
    engine: regex
    depends_on: []
    config:
      pattern: ^(?P<ts>[A-Z][a-z]{2}\s+\d{1,2} \d{2}:\d{2}:\d{2}) (?P<host>\S+) (?P<proc>\w+)\[(?P<pid>\d+)\]:\s+(?P<message>.*)$
  normalize:
    engine: reasoner
    depends_on:
    - parse
    config:
      ruleset: reasoning.yaml
  behavior:
    engine: sliding_window
    depends_on:
    - normalize
    config:
      model: behavior.model
  emit:
    engine: fact_emitter
    depends_on:
    - behavior
    config: {}
