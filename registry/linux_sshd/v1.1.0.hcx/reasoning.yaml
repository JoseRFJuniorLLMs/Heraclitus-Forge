rules:
- id: ssh_auth_failure
  when:
  - field: message
    matches: Failed password for (?:invalid user )?(?P<target_user>\S+) from (?P<src_ip>\S+)
  set:
    action: authentication.failure
    behavior_class: credential_attack
    risk: High
    identity:
      actor_name: ${target_user}
      target_id: ${host}
      source_ip: ${src_ip}
- id: ssh_invalid_user
  when:
  - field: message
    matches: Invalid user (?P<target_user>\S+) from (?P<src_ip>\S+)
  set:
    action: authentication.invalid_user
    behavior_class: reconnaissance
    risk: Medium
    identity:
      actor_name: ${target_user}
      target_id: ${host}
      source_ip: ${src_ip}
- id: ssh_auth_success
  when:
  - field: message
    matches: Accepted (?:password|publickey) for (?P<target_user>\S+) from (?P<src_ip>\S+)
  set:
    action: authentication.success
    behavior_class: session
    risk: Low
    identity:
      actor_name: ${target_user}
      target_id: ${host}
      source_ip: ${src_ip}
- id: ssh_session_opened
  when:
  - field: message
    matches: session opened for user (?P<target_user>\S+)
  set:
    action: session.open
    behavior_class: session
    risk: Low
    identity:
      actor_name: ${target_user}
      target_id: ${host}
