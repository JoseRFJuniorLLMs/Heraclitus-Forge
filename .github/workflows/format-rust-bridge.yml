name: Format Rust bridge (temporary)

on:
  push:
    branches: [feat/rust-bridge-runtime]
    paths:
      - .github/workflows/format-rust-bridge.yml

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/rust-bridge-runtime
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Format workspace
        working-directory: rust
        run: cargo fmt --all
      - name: Commit formatting if changed
        shell: bash
        run: |
          if git diff --quiet -- rust; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust
          git commit -m "style(bridge): apply rustfmt"
          git push origin HEAD:feat/rust-bridge-runtime
