name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A action publica o resultado no proprio PR; com `contents: read` apenas,
    # ela falha com 403 em qualquer `pull_request` — e o job vermelho passava a
    # parecer uma fuga de segredo quando era falta de permissao.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: rust
      - name: clippy — all targets, deny warnings
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: tests — all targets
        run: cargo test --all-targets --locked
      - name: release binaries
        run: cargo build --release --bins --locked
      - name: install cargo-audit
        run: cargo install cargo-audit --locked
      - name: RustSec — deny vulnerabilities and warnings
        run: cargo audit --deny warnings
      # Por ULTIMO e com `!cancelled()`: enquanto o `format` foi o primeiro
      # passo, uma divergencia cosmetica abortava o job antes do `clippy` e
      # escondia erros de compilacao reais. Continua a reprovar — mas nunca
      # antes de os gates que importam terem falado.
      - name: format (nao mascara os gates acima)
        if: '!cancelled()'
        run: cargo fmt --all -- --check

  python-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: rust
      - name: install exact hashed environment
        run: |
          python -m pip install uv==0.11.24
          uv venv .venv --python 3.12
          uv pip sync requirements.lock --python .venv/bin/python --require-hashes
      # `ruff check` fica cedo de proposito: apanha nomes indefinidos e imports
      # partidos, e um gate semantico e barato. So o `ruff format --check`, que
      # e puramente cosmetico, foi para o fim do job.
      - name: Python lint
        run: .venv/bin/ruff check .
      - name: Python and cross-language tests
        run: .venv/bin/python -m pytest
      - name: Python dependency audit
        run: >-
          .venv/bin/pip-audit --strict --require-hashes
          --disable-pip -r requirements.lock
      - name: verify every registry artifact signature
        run: .venv/bin/python forge_sign.py verify-all
      - name: synthetic loader is fail-closed by default
        shell: bash
        run: |
          if .venv/bin/python inserir.py; then
            echo "inserir.py iniciou sem --confirm-demo-load"
            exit 1
          fi
      - name: Python format (cosmetico; corre no fim para nao mascarar os testes)
        if: '!cancelled()'
        run: .venv/bin/ruff format --check .
