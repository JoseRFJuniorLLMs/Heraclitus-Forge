name: Update Rust lock (temporary)

on:
  push:
    branches: [feat/rust-bridge-runtime]
    paths:
      - rust/Cargo.toml
      - .github/workflows/update-rust-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/rust-bridge-runtime
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action
        with:
          toolchain: 1.96.0
      - name: Generate locked dependency graph
        working-directory: rust
        run: cargo generate-lockfile
      - name: Commit Cargo.lock if changed
        shell: bash
        run: |
          if git diff --quiet -- rust/Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/Cargo.lock
          git commit -m "chore(bridge): update Rust lockfile"
          git push origin HEAD:feat/rust-bridge-runtime
