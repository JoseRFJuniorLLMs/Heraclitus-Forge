name: Refresh Python security lock (temporary)

on:
  push:
    branches: [feat/rust-bridge-runtime]
    paths:
      - .github/workflows/refresh-python-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/rust-bridge-runtime
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Regenerate lock with urllib3 security update
        shell: bash
        run: |
          python -m pip install uv==0.11.24
          uv pip compile requirements-dev.txt             --universal             --generate-hashes             --python-version 3.12             --output-file requirements.lock             --upgrade-package urllib3
      - name: Commit lock if changed
        shell: bash
        run: |
          if git diff --quiet -- requirements.lock; then
            echo "requirements.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock
          git commit -m "chore(deps): refresh Python lock"
          git push origin HEAD:feat/rust-bridge-runtime
