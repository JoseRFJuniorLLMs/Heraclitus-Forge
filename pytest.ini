[pytest]
testpaths = tests
# `live` marca os testes que escrevem no HeraclitusDB local. Ficam DE FORA de um
# `pytest` normal: esse banco é a memória do utilizador, não um sandbox.
#   pytest              -> tudo menos os live
#   pytest -m live      -> só os que escrevem mesmo
addopts = -m "not live" -q
markers =
    live: escreve no HeraclitusDB real em 127.0.0.1:7474 (opt-in)
