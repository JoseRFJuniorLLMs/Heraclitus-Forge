[package]
name = "heraclitus-forge"
version = "1.0.0"
edition = "2021"
description = "Heraclitus Runner + HeraclitusDB — runtime nativo line-rate (port Rust)"
publish = false
license-file = "../LICENSE"

[lib]
name = "heraclitus"
path = "src/lib.rs"

[[bin]]
name = "connector_postgresql"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "cluster_demo"
path = "src/bin/cluster_demo.rs"

[[bin]]
name = "gateway"
path = "src/bin/gateway.rs"

[[bin]]
name = "hql"
path = "src/bin/hql.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[[bin]]
name = "fabric"
path = "src/bin/fabric.rs"

[[bin]]
name = "coverage"
path = "src/bin/coverage.rs"

# Ponte Forge -> HeraclitusDB: exporta os Fatos do .hdb em JSON Lines
[[bin]]
name = "export_facts"
path = "src/bin/export_facts.rs"

# Marco D: ingestor real (segue um ficheiro de log ao vivo)
[[bin]]
name = "ingest"
path = "src/bin/ingest.rs"

[[bin]]
name = "quarantine"
path = "src/bin/quarantine.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
blake3 = "1"
ed25519-dalek = "2"   # Marco B: assinatura real da âncora (não mais mock)
getrandom = "0.2"     # geração da seed da chave (CSPRNG do SO)
chacha20poly1305 = "0.10" # quarentena cifrada XChaCha20-Poly1305
uuid = { version = "1", features = ["v7"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Log rotativo diario do ingestor em modo servico: sem consola, o ficheiro e a
# unica forma de saber o que aconteceu.
tracing-appender = "0.2"

# O ingestor corre como servico do Windows (mesmo padrao do heraclitus-service):
# aparece em services.msc, arranca no boot e o SCM aplica a recuperacao.
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
# Gateway de ingestao (backend do dashboard) — stack Rust recomendada
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
axum = "0.7"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
