[package]
name = "heraclitus-security-schema"
version = "1.0.0"
edition = "2021"
description = "Modelo canonico de evento de seguranca (SPEC-0071 delta 1) — tipos, validacao, canonicalizacao e mappings versionados"
publish = false
license-file = "../../../LICENSE"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
